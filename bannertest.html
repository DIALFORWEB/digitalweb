<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neo GS Promotional Banner</title>
<style>
  /* Reset/base */
  body, html {
    margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif; color: #222;
    overflow-x: hidden;
    background: white;
  }
  a {
    color: inherit; text-decoration: none;
  }
  a:focus, button:focus {
    outline: 3px solid #7C3AED; outline-offset: 2px;
  }

  /* Root colors */
  :root {
    --purple-start: #7C3AED;
    --blue-end: #146EF5;
    --dark-text: #222;
    --light-text: #666;
    --btn-bg: #7C3AED;
    --btn-bg-hover: #5a24b0;
  }

  /* Container filling viewport */
  .banner {
    position: relative;
    height: 100vh;
    max-width: 1280px;
    margin: auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2rem 3rem;
  }

  /* Top header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 2rem;
    z-index: 10;
    position: relative;
  }
  /* Logo area */
  .logo {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--purple-start);
    text-transform: lowercase;
  }
  .logo svg {
    width: 28px; height: 28px;
    fill: var(--purple-start);
  }

  /* Nav links */
  nav {
    display: flex; gap: 2rem;
  }
  nav a {
    font-weight: 600;
    font-size: 1rem;
    color: var(--dark-text);
    transition: color 0.3s ease;
  }
  nav a:hover, nav a:focus {
    color: var(--btn-bg);
  }

  /* Main content flex */
  .main-content {
    flex: 1 1 auto;
    display: flex;
    gap: 3rem;
    position: relative;
  }

  /* Left content area */
  .left-content {
    width: 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .left-content h1 {
    font-size: 4rem;
    font-weight: 900;
    line-height: 1.1;
    margin: 0 0 1rem 0;
    color: var(--dark-text);
  }
  .left-content h1 .highlight {
    background: linear-gradient(90deg, var(--purple-start), var(--blue-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .left-content p {
    font-size: 1.1rem;
    color: var(--light-text);
    max-width: 420px;
    margin-bottom: 2rem;
  }
  .btn-preorder {
    width: fit-content;
    padding: 0.9rem 2.5rem;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 40px;
    border: none;
    background-color: var(--btn-bg);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(124, 58, 237, 0.6);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }
  .btn-preorder:hover,
  .btn-preorder:focus {
    background-color: var(--btn-bg-hover);
    box-shadow: 0 8px 21px rgba(124, 58, 237, 0.85);
    outline: none;
  }

  /* Right content area */
  .right-content {
    width: 55%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tagline {
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 1.8rem;
    color: var(--light-text);
    user-select: none;
  }

  /* Laptop illustration container */
  .laptop {
    width: 420px;
    height: 260px;
    border-radius: 1.2rem 1.2rem 1rem 1rem;
    background: linear-gradient(135deg, var(--purple-start), var(--blue-end));
    box-shadow: 0 22px 50px rgba(20, 110, 245, 0.3);
    position: relative;
  }
  /* Screen part */
  .screen {
    width: 100%;
    height: 74%;
    border-radius: 1.2rem 1.2rem 0 0;
    background: linear-gradient(45deg, #140233, #5c3ea3);
    box-shadow: inset 0 0 40px rgba(124, 58, 237, 0.9);
  }
  /* Base of laptop */
  .base {
    width: 100%;
    height: 26%;
    background: #292929;
    border-radius: 0 0 1rem 1rem;
    box-shadow:
      inset 0 6px 10px rgba(0, 0, 0, 0.9),
      0 4px 10px rgba(20, 110, 245, 0.25);
  }
  /* Release badge below laptop */
  .release-badge {
    margin-top: 1.5rem;
    padding: 0.4rem 1.2rem;
    border-radius: 40px;
    background: #292929;
    box-shadow: 0 0 15px rgba(20, 110, 245, 0.4);
    font-weight: 600;
    color: #bbb;
    user-select: none;
  }

  /* Diagonal curved split: SVG overlay */
  .diagonal-separator {
    pointer-events: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* Honeycomb pattern behind laptop */
  .honeycomb {
    position: absolute;
    right: 5%;
    top: 20%;
    width: 370px;
    height: 320px;
    background:
      radial-gradient(circle 10px at 15px 15px, #7C3AED33 98%, transparent 100%),
      radial-gradient(circle 10px at 45px 15px, #146EF533 98%, transparent 100%);
    background-size: 60px 52px;
    background-position: 0 0, 30px 26px;
    filter: blur(1.2px);
    user-select: none;
  }

  /* Sparkles on the diagonal curve */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: white;
    filter: drop-shadow(0 0 10px white);
    opacity: 0.6;
    animation: sparklePulse 4s infinite ease-in-out;
  }
  @keyframes sparklePulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .sparkle1 {
    width: 8px; height: 8px; top: 23vh; left: 48vw;
    animation-delay: 0s;
  }
  .sparkle2 {
    width: 10px; height: 10px; top: 38vh; left: 43vw;
    animation-delay: 1.5s;
  }
  .sparkle3 {
    width: 7px; height: 7px; top: 50vh; left: 49vw;
    animation-delay: 3s;
  }
  .sparkle4 {
    width: 6px; height: 6px; top: 30vh; left: 53vw;
    animation-delay: 2.1s;
  }
  .sparkle5 {
    width: 5px; height: 5px; top: 53vh; left: 41vw;
    animation-delay: 1.1s;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .banner {
      padding: 1.5rem 1.5rem 3rem;
      height: auto;
    }
    header {
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 1rem;
    }
    nav {
      gap: 1.3rem;
      justify-content: center;
      width: 100%;
    }
    .main-content {
      flex-direction: column;
      gap: 2.5rem;
      align-items: center;
    }
    .left-content, .right-content {
      width: 100%;
      text-align: center;
    }
    .left-content h1 {
      font-size: 2.8rem;
    }
    .right-content {
      gap: 0.7rem;
    }
    .laptop {
      width: 90vw;
      max-width: 380px;
      height: auto;
    }
    .honeycomb {
      display: none;
    }
  }

</style>

<!-- Google font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;900&display=swap" rel="stylesheet"/>

</head>
<body>

<div class="banner" role="main" aria-label="Neo GS promotional banner">

  <header>
    <div class="logo" aria-label="Your Logo">
      <!-- Hexagon Icon -->
      <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false" >
        <polygon points="50 5 90 27.5 90 72.5 50 95 10 72.5 10 27.5"/>
      </svg>
      yourlogo.
    </div>
    <nav role="navigation" aria-label="Primary navigation">
      <a href="#" tabindex="0">Home</a>
      <a href="#" tabindex="0">About Us</a>
      <a href="#" tabindex="0">Product</a>
      <a href="#" tabindex="0">Contact Us</a>
    </nav>
  </header>

  <section class="main-content">

    <div class="left-content">
      <h1>Introducing <span class="highlight">Neo GS</span></h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
      <button class="btn-preorder">Pre Order</button>
    </div>

    <div class="right-content" aria-label="Product showcase">
      <div class="tagline">Advanced Gaming Technology</div>
      <div class="laptop" role="img" aria-label="Stylized laptop with gradient screen">
        <div class="screen"></div>
        <div class="base"></div>
      </div>
      <div class="release-badge" tabindex="0" aria-label="Available on 2020">Available on 2020</div>
      <div class="honeycomb" aria-hidden="true"></div>
    </div>
    
    <!-- Curved diagonal SVG overlay -->
    <svg class="diagonal-separator" aria-hidden="true" focusable="false" viewBox="0 0 100 100" preserveAspectRatio="none" >
      <path fill="white" d="M 48 0 Q 90 50 48 100 L 0 100 L 0 0 Z" />
    </svg>

    <!-- Sparkles -->
    <div class="sparkle sparkle1"></div>
    <div class="sparkle sparkle2"></div>
    <div class="sparkle sparkle3"></div>
    <div class="sparkle sparkle4"></div>
    <div class="sparkle sparkle5"></div>

  </section>
</div>

</body>
</html>
